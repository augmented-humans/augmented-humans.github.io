about-title: About the conference
about: |
  The Augmented Humans (AHs) International Conference 2027 will be an in-person event, held from March 7th to 10th, 2027 at the Cinnamon Life City of Dreams in Colombo, Sri Lanka. More information on the time schedule will be made available soon. 
  The conference focuses on physical, cognitive, and perceptual augmentation of humans through digital technologies. The plural – humans – emphasizes the move towards technologies that enhance human capabilities beyond the individual and will have the potential for impact on a societal scale.
  The idea of augmenting the human intellect has a long tradition, the term was coined by Douglas Engelbart in 1962<sup>[1]</sup>. Today, many of the technologies envisioned by Engelbart and others are commonplace, and looking towards the future, many technologies which amplify the human body and mind far beyond the original vision are within reach.
  The conference proceedings are planned to be published in the ACM Digital Library as a volume in its International Conference Proceedings Series with ISBN.

  <text style="font-size: medium">[1] Engelbart, Douglas C.: "AUGMENTING HUMAN INTELLECT: A Conceptual Framework." (1962)</text>

