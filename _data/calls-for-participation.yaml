add-title: Additional Information
add: |
  At least one author of each accepted paper must register for the conference and present the paper in Colombo. Exceptions of in-person presentations can be granted in emergency situations (e.g., visa issues) upon request from the general chairs. If you are in such a situation please contact the general chairs via e-mail.

