page-title: <strong>T</strong>ravel

visa-title: VISA
visa: |
  Most visitors need an Electronic Travel Authorization (ETA) to enter Sri Lanka, and it must be obtained online before you travel. Apply through the Department of Immigration &amp; Emigration at <a style="color:#118e78" href="https://eta.gov.lk">eta.gov.lk</a>.

  Please apply only through the official government site above. A number of look-alike sites offer the same authorization for an added fee.
