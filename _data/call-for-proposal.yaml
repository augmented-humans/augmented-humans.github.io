overview-title: Call for Proposals to Host Augmented Humans
overview: |
  The Augmented Humans Steering Committee welcomes proposals to host and organize AHs 2028. We also welcome expressions of interest in hosting AHs 2029. 
  Augmented Humans (AHs) is an ACM SIGCHI conference and is typically held in March or April. AHs attracts an interdisciplinary audience from HCI, engineering, design, robotics, wearable computing, and related fields, and provides a platform for presenting research, exchanging ideas, and meeting people working on technologies that augment human capabilities. We value diversity and aim to bring together different perspectives on human augmentation.
  AHs is a compact single track conference with a strong emphasis on interaction between participants. AHs has a number of submission tracks, including full papers, short papers, posters and demos, and workshops, and supports different presentation formats such as talks, posters, demonstrations, and hands-on sessions. Interactive demonstrations and opportunities to experience augmentation technologies firsthand are an important part of the conference, alongside workshops and other activities that provide opportunities to exchange ideas, learn from each other, and build the AHs community.

submissions-title: Proposals should address the following
submissions: |
  - <strong>Organizing team and local support.</strong> Key organizers, proposed roles, relevant experience, supporting institutions, and available administrative, financial, and technical support.
  - <strong>Location, venue, and accessibility.</strong> Host city, venue, capacities, facilities for talks, workshops, posters and demos, travel connections, visas, accommodation, and accessibility.
  - <strong>Dates, timeline, and program.</strong> Proposed conference dates, key organizational deadlines, and a draft structure for talks, posters and demos, workshops, keynotes, and social activities.
  - <strong>Budget and sponsorship.</strong> Expected income and expenses, attendance assumptions, registration fees, institutional support, and potential sponsors.
  - <strong>ACM/SIGCHI requirements.</strong> Commitment to work with ACM and SIGCHI and meet relevant conference and publication requirements.
  - <strong>Community fit and international rotation.</strong> Why the proposed location is attractive to AHs and how it can support and grow the community.
  - Vision for the conference. Any themes, new formats, or other ideas you would like to introduce, while maintaining the overall character of the conference.


reviewing-title: Selection
reviewing: |
  The Augmented Humans Steering Committee will work with interested teams to help develop strong and feasible hosting proposals. Proposals will be considered with attention to the organizing team, venue and budget, accessibility, institutional support, geographic rotation, and the potential contribution to the AHs community.

publication-title: Submission
publication: |
  Please submit proposals for AHs 2028 and AHs 2029 as PDF documents. For AHs 2028, submissions should include a full proposal. For AHs 2029, informal submissions are sufficient; a short note describing the potential organizing team, location, and general idea is enough. If you are preparing a bid, feel free to reach out informally to the steering committee or this years general chairs in advance.
  The Steering Committee will follow up with proposing teams and support them through the next steps.
  Please submit all proposals and expressions of interest using this form: <a href="https://forms.gle/AbhC23KgTQfgaaAs5">https://forms.gle/AbhC23KgTQfgaaAs5</a>

