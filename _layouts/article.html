---
layout: default
---
<header class="masthead text-center text-white normal" style="background-color: #a9c4e5;">
  <div id="particles-js" class="masthead-content">
    <div class="container">
      <div class="row">
        <div class="col-lg-1"></div>
        <div class="col-lg-10">
          <h1 class="masthead-heading mb-0">{{ page.title }}</h1>
        </div>
        <div class="col-lg-1"></div>
      </div>
    </div>
  </div>
</header>

<article class="kw-blog-post">
{%- assign post_parts = content | split: '<h2' -%}
{%- assign post_sections = 0 -%}
{%- for part in post_parts -%}
  {%- assign part_text = part | strip -%}
  {%- if part_text == "" -%}{%- continue -%}{%- endif -%}
  {%- assign post_sections = post_sections | plus: 1 %}
  <section id="ah-categories" class="flip{% if post_sections > 1 %} top-bar{% endif %}">
    <div class="container">
      <div class="row">
        <div class="col-lg-1"></div>
        <div class="col-lg-10">
          <div class="post-content">
            {% unless forloop.first %}<h2{% endunless %}{{ part }}
          </div>
          {%- if forloop.last %}
          <div class="post-date">Published {{ page.date | date: "%B %-d, %Y" }}{% if page.author %} by {{ page.author }}{% endif %}</div>
          <div class="post-back"><a href="{{ '/blog/' | relative_url }}">&larr; All blog posts</a></div>
          {%- endif %}
        </div>
        <div class="col-lg-1"></div>
      </div>
    </div>
  </section>
{%- endfor %}
</article>
